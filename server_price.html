          borderColor: isDark() ? '#2a3645' : '#cfd7df',
          borderWidth: 1,
          titleColor: isDark() ? '#e6edf3' : '#24292f',
          bodyColor: isDark() ? '#c9d1d9' : '#57606a',
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: $${ctx.parsed.y != null ? ctx.parsed.y.toFixed(2) : 'N/A'}/hr`,
          },
        },
      },
      scales: {
        x: {
          type: 'category',
          ticks: { color: tickColor(), maxRotation: 0, maxTicksLimit: 8, font: { size: 11 } },
          grid: { color: gridColor() },
        },
        y: {
          ticks: { color: tickColor(), font: { size: 11 }, callback: v => '$' + v.toFixed(2) },
          grid: { color: gridColor() },
        },
      },
    },
  });
}

function buildOverview() {
  const datasets = makeDatasets(RAW, '33');
  const ctx = document.getElementById('overviewChart').getContext('2d');
  const chart = makeChart(ctx, datasets, false);

  const leg = document.getElementById('overviewLegend');
  datasets.forEach((ds, i) => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${ds.borderColor}"></span><span>${ds.label}</span>`;
    item.addEventListener('click', () => {
      const meta = chart.getDatasetMeta(i);
      meta.hidden = !meta.hidden;
      item.style.opacity = meta.hidden ? '0.4' : '1';
      chart.update();
    });
    leg.appendChild(item);
  });
}

function chgClass(v) {
  if (v == null) return 'flat';
  return v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
}
function chgStr(v) {
  if (v == null) return 'N/A';
  return (v > 0 ? '+' : '') + v.toFixed(2) + '%';
}

function buildCards() {
  const grid = document.getElementById('cardGrid');
  RAW.forEach(s => {
    const vals = s.values.filter(v => v != null);
    if (vals.length === 0) return;

    const latest = vals[vals.length - 1];
    const prev1d = vals.length >= 2 ? vals[vals.length - 2] : null;
    const prev1w = vals.length >= 8 ? vals[vals.length - 8] : vals[0];
    const prev1m = vals.length >= 22 ? vals[vals.length - 22] : vals[0];
    const chg1d = prev1d != null ? (latest - prev1d) / prev1d * 100 : null;
    const chg1w = prev1w != null ? (latest - prev1w) / prev1w * 100 : null;
    const chg1m = prev1m != null ? (latest - prev1m) / prev1m * 100 : null;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-title" style="color:${s.color}">${s.name}</div>
      <div class="card-stat">
        <div class="stat-item">
          <div class="stat-label">最新价格</div>
          <div class="stat-value">$${latest.toFixed(2)}</div>
          <div class="stat-label">$/hr</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">日变化</div>
          <div class="stat-value ${chgClass(chg1d)}">${chgStr(chg1d)}</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">周变化</div>
          <div class="stat-value ${chgClass(chg1w)}">${chgStr(chg1w)}</div>
        </div>
        <div class="stat-item">
          <div class="stat-label">月变化</div>
          <div class="stat-value ${chgClass(chg1m)}">${chgStr(chg1m)}</div>
        </div>
      </div>
      <div class="card-chart"><canvas id="card-${s.name.replace(/ /g,'-')}"></canvas></div>
    `;
    grid.appendChild(card);

    const ctx = card.querySelector('canvas').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        datasets: [{
          data: s.dates.map((d, i) => ({ x: d, y: s.values[i] })).filter(p => p.y != null),
          borderColor: s.color,
          backgroundColor: s.color + '22',
          borderWidth: 2,
          pointRadius: 0,
          fill: true,
          tension: 0.3,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: isDark() ? '#1c2433' : '#fff',
            borderColor: isDark() ? '#2a3645' : '#cfd7df',
            borderWidth: 1,
            titleColor: isDark() ? '#e6edf3' : '#24292f',
            bodyColor: isDark() ? '#c9d1d9' : '#57606a',
            callbacks: { label: c => ` $${c.parsed.y.toFixed(2)}/hr` },
          },
        },
        scales: {
          x: { type: 'category', display: false },
          y: { ticks: { color: tickColor(), font: { size: 10 }, callback: v => '$' + v.toFixed(2) }, grid: { color: gridColor() } },
        },
      },
    });
  });
}

const savedTheme = localStorage.getItem('dashboardTheme') || 'dark';
document.documentElement.dataset.theme = savedTheme;
const themeSelect = document.getElementById('themeSelect');
themeSelect.value = savedTheme;
themeSelect.addEventListener('change', () => {
  document.documentElement.dataset.theme = themeSelect.value;
  localStorage.setItem('dashboardTheme', themeSelect.value);
  location.reload();
});

buildOverview();
buildCards();
</script>
</body>
</html>
