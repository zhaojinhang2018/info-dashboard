<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>信息看板 · 首页</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; text-align: center; }
    .subtitle { font-size: 14px; color: #8b949e; margin-bottom: 48px; text-align: center; }
    .cards {
      width: min(1040px, 100%);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 20px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px 28px;
      min-height: 190px;
      width: 100%;
      text-align: center;
      text-decoration: none;
      color: #e6edf3;
      transition: border-color .2s, transform .2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .card:hover { border-color: #58a6ff; transform: translateY(-3px); }
    .card .icon { font-size: 42px; line-height: 1; }
    .card .title { font-size: 17px; font-weight: 600; }
    .card .desc { font-size: 13px; color: #8b949e; line-height: 1.5; }
    .card.x:hover { border-color: #e0e0e0; }
    .card.xueqiu:hover { border-color: #f0b90b; }
    .card.news:hover { border-color: #f0883e; }
    .card.stocks:hover { border-color: #3fb950; }
    .card.wechat:hover { border-color: #07c160; }
    .card.disabled { opacity: .45; cursor: default; pointer-events: none; }
    footer { margin-top: 60px; font-size: 12px; color: #484f58; }
      .theme-select { margin: 12px 0 18px; border: 1px solid #30363d; border-radius: 6px; background: #161b22; color: #e6edf3; font-size: 13px; padding: 7px 10px; }
    [data-theme="light"] body { background: #eef2f6; color: #24292f; }
    [data-theme="light"] .subtitle { color: #667085; }
    [data-theme="light"] .card { background: #f7f9fb; border-color: #cfd7df; color: #24292f; }
    [data-theme="light"] .card .desc { color: #667085; }
    [data-theme="light"] .theme-select { background: #ffffff; border-color: #cfd7df; color: #24292f; }
    @media (max-width: 980px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>📡 信息看板</h1>
  <select id="themeSelect" class="theme-select" aria-label="背景颜色"><option value="dark">深色</option><option value="light">浅色</option></select>
  <p class="subtitle">一键更新 · 新闻 / X / 股价异动 / 雪球 / 微信公众号</p>

  <div class="cards">
    <a class="card x" href="x_feed.html">
      <span class="icon">🐦</span>
      <span class="title">X 动态</span>
      <span class="desc">关注用户的最新推文</span>
    </a>
    <a class="card news" href="news.html">
      <span class="icon">📰</span>
      <span class="title">新闻看板</span>
      <span class="desc">宏观 · AI/科技 · 加密<br>地缘政治</span>
    </a>
    <a class="card stocks" href="stock_alerts.html">
      <span class="icon">📈</span>
      <span class="title">股价异动</span>
      <span class="desc">标普500 盘后异动<br>AI 分析涨跌原因</span>
    </a>
    <a class="card xueqiu" href="xueqiu_user.html">
      <span class="icon">雪球</span>
      <span class="title">雪球发言</span>
      <span class="desc">指定用户发言<br>搜索与互动统计</span>
    </a>
    <a class="card wechat" href="wechat.html">
      <span class="icon">💬</span>
      <span class="title">微信公众号</span>
      <span class="desc">财经/投资公众号<br>AI 摘要 · 关键词</span>
    </a>
    <a class="card disabled">
      <span class="icon">⭐</span>
      <span class="title">知识星球</span>
      <span class="desc">即将上线</span>
    </a>
    <a class="card disabled">
      <span class="icon">🎯</span>
      <span class="title">预测市场</span>
      <span class="desc">Kalshi · Polymarket<br>即将上线</span>
    </a>
    <a class="card disabled">
      <span class="icon">✈️</span>
      <span class="title">Telegram</span>
      <span class="desc">频道内容跟踪<br>即将上线</span>
    </a>
  </div>

  <footer>运行 run_all.py 更新全部模块 · 本地运行 · 仅供参考</footer>
<script>
const savedTheme = localStorage.getItem('dashboardTheme') || 'dark';
document.documentElement.dataset.theme = savedTheme;
const themeSelect = document.getElementById('themeSelect');
themeSelect.value = savedTheme;
themeSelect.addEventListener('change', () => {
  document.documentElement.dataset.theme = themeSelect.value;
  localStorage.setItem('dashboardTheme', themeSelect.value);
});
</script></body>
</html>
