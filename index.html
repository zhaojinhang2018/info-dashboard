<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>金融信息看板</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#0d1117;--panel:#161b22;--panel-2:#0f141b;--text:#e6edf3;--muted:#8b949e;--border:#30363d;--border-soft:#21262d;--link:#58a6ff;--active:#238636;--active-border:#2ea043;--analysis:#0d1117;--chip:#0d2818;--chip-text:#3fb950;--chip-border:#1a4a2a}
[data-theme="light"]{--bg:#f6f8fa;--panel:#ffffff;--panel-2:#f0f3f6;--text:#1f2328;--muted:#59636e;--border:#d0d7de;--border-soft:#d8dee4;--link:#0969da;--active:#1f883d;--active-border:#1f883d;--analysis:#f6f8fa;--chip:#eaf7ee;--chip-text:#1a7f37;--chip-border:#b7e1c1}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",sans-serif}body{min-height:100vh}.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border);padding:14px 20px}.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}.top h1{margin:0 0 8px;font-size:20px;font-weight:700}.meta{color:var(--muted);font-size:12px}.toolbar{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid var(--border);background:var(--panel-2);color:var(--text);border-radius:7px;padding:8px 12px;cursor:pointer;font-size:14px}.tab.active{background:var(--active);border-color:var(--active-border);color:#fff}.theme-select{border:1px solid var(--border);background:var(--panel-2);color:var(--text);border-radius:7px;padding:8px 10px;font-size:14px}.page{display:none;padding:16px 20px}.page.active{display:block}.board{display:grid;gap:14px;align-items:start}.news-board{grid-template-columns:repeat(4,minmax(240px,1fr))}.x-board{grid-template-columns:repeat(5,minmax(260px,1fr))}.stock-board{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}.xueqiu-board{display:grid;grid-auto-flow:column;grid-auto-columns:380px;gap:14px;overflow-x:auto;padding-bottom:16px}.wechat-board{max-width:1320px;margin:0 auto}.col-head,.card,.wechat-panel{background:var(--panel);border:1px solid var(--border);border-radius:8px}.col-head{padding:12px 14px;margin-bottom:8px;font-weight:700}.col-head .sub{margin-top:3px;color:var(--muted);font-size:12px;font-weight:500}.card{padding:12px 14px;margin-bottom:8px}.card:hover,.wechat-item:hover{border-color:var(--link)}.title{display:block;color:var(--text);text-decoration:none;font-size:15px;font-weight:650;line-height:1.55}.title:hover{color:var(--link)}.text{margin-top:7px;color:var(--text);font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}.muted{color:var(--muted);font-size:12px;line-height:1.5}.link{color:var(--link);text-decoration:none}.link:hover{text-decoration:underline}.tweet-meta,.pill-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px}.stock-top{display:flex;justify-content:space-between;gap:10px}.ticker{font-size:20px;font-weight:800}.pct{font-size:20px;font-weight:800}.analysis{margin-top:10px;background:var(--analysis);border-left:3px solid var(--border);border-radius:6px;padding:10px 12px;color:var(--text);font-size:13px;line-height:1.7}.summary{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:14px;color:var(--muted);font-size:13px}.photo{width:100%;border-radius:6px;margin-top:8px;max-height:160px;object-fit:cover;background:var(--analysis)}.empty{color:var(--muted);padding:40px 0;text-align:center}
.wechat-panel{overflow:hidden}.wechat-head{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start;padding:14px 16px;border-bottom:1px solid var(--border-soft);background:var(--panel-2)}.wechat-head h2{margin:0 0 4px;font-size:18px}.wechat-stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.stat{border:1px solid var(--border);border-radius:7px;padding:6px 9px;background:var(--panel);font-size:12px;color:var(--muted)}.wechat-filters{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--border-soft)}.filter-btn{flex:0 0 auto;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:999px;padding:6px 10px;font-size:13px;cursor:pointer}.filter-btn.active{background:var(--active);border-color:var(--active-border);color:#fff}.wechat-list{display:grid}.wechat-item{display:grid;grid-template-columns:1fr 130px;gap:16px;padding:13px 16px;border-bottom:1px solid var(--border-soft);border-left:3px solid transparent;background:var(--panel)}.wechat-item:last-child{border-bottom:0}.wechat-main{min-width:0}.wechat-source{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:6px}.wechat-date{color:var(--muted);font-size:13px;text-align:right;white-space:nowrap}.kw{display:inline-flex;align-items:center;border:1px solid var(--chip-border);background:var(--chip);color:var(--chip-text);border-radius:999px;padding:1px 7px;font-size:12px;line-height:1.6}
@media(max-width:1400px){.x-board{grid-template-columns:repeat(4,minmax(260px,1fr))}.news-board{grid-template-columns:repeat(2,minmax(260px,1fr))}}
@media(max-width:800px){.top{padding:12px}.page{padding:12px}.toolbar,.tabs{width:100%}.tab{flex:1 1 auto}.theme-select{width:100%}.news-board,.x-board,.stock-board{grid-template-columns:1fr}.xueqiu-board{display:block;overflow:visible}.wechat-head,.wechat-item{grid-template-columns:1fr}.wechat-stats{justify-content:flex-start}.wechat-date{text-align:left}}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div>
      <h1>金融信息看板</h1>
      <div class="meta" id="updated">加载中...</div>
    </div>
    <div class="toolbar">
      <nav class="tabs" aria-label="&#30475;&#26495;&#33756;&#21333;">
        <button class="tab active" type="button" data-tab="news" aria-selected="true">&#26032;&#38395;</button>
        <button class="tab" type="button" data-tab="tweets" aria-selected="false">X&#21160;&#24577;</button>
        <button class="tab" type="button" data-tab="stocks" aria-selected="false">&#32929;&#20215;&#24322;&#21160;</button>
        <button class="tab" type="button" data-tab="xueqiu" aria-selected="false">&#38634;&#29699;</button>
        <button class="tab" type="button" data-tab="wechat" aria-selected="false">&#20844;&#20247;&#21495;</button>
      </nav>
      <select id="themeSelect" class="theme-select" aria-label="&#32972;&#26223;&#39068;&#33394;">
        <option value="dark">&#26263;&#33394;</option>
        <option value="light">&#27973;&#33394;</option>
      </select>
    </div>
  </div>
</header>
<main>
  <section id="news" class="page active"></section>
  <section id="tweets" class="page"></section>
  <section id="stocks" class="page"></section>
  <section id="xueqiu" class="page"></section>
  <section id="wechat" class="page"></section>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const load=p=>fetch(p,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);
const tabIds=['news','tweets','stocks','xueqiu','wechat'];
const tabs=[...document.querySelectorAll('.tab')];
const pages=tabIds.map(id=>document.getElementById(id));
function showTab(id,updateHash=true){
  const next=tabIds.includes(id)?id:'news';
  tabs.forEach(btn=>{const active=btn.dataset.tab===next;btn.classList.toggle('active',active);btn.setAttribute('aria-selected',active?'true':'false')});
  pages.forEach(page=>page.classList.toggle('active',page.id===next));
  if(updateHash&&location.hash.slice(1)!==next) history.replaceState(null,'','#'+next);
}
tabs.forEach(btn=>btn.addEventListener('click',()=>showTab(btn.dataset.tab)));
window.addEventListener('hashchange',()=>showTab(location.hash.slice(1),false));
const savedTheme=localStorage.getItem('dashboardTheme')||'dark';
document.documentElement.dataset.theme=savedTheme;
themeSelect.value=savedTheme;
themeSelect.addEventListener('change',()=>{document.documentElement.dataset.theme=themeSelect.value;localStorage.setItem('dashboardTheme',themeSelect.value)});
showTab(location.hash.slice(1),false);
function titleLink(text,url){return url?`<a class="title" href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>`:`<div class="title">${esc(text)}</div>`}
function renderCard(title,body,url,meta=''){return `<article class="card">${titleLink(title,url)}${meta?`<div class="muted">${esc(meta)}</div>`:''}${body?`<div class="text">${esc(body)}</div>`:''}</article>`}
Promise.all([load('data/news.json'),load('data/tweets.json'),load('data/stocks.json'),load('data/xueqiu.json'),load('data/wechat.json')]).then(([newsData,tweetsData,stocksData,xueqiuData,wechatData])=>{
  const times=[newsData,tweetsData,stocksData,xueqiuData,wechatData].filter(Boolean).map(x=>x.updated_at).filter(Boolean);
  document.getElementById('updated').textContent='最后更新：'+(times[0]||'未知');
  renderNews(newsData); renderTweets(tweetsData); renderStocks(stocksData); renderXueqiu(xueqiuData); renderWechat(wechatData);
});
function renderNews(data){
  const cols=(data?.categories||[]).map(c=>`<section><div class="col-head">${esc(c.category)}</div>`+(c.items||[]).map(i=>renderCard(i.title,i.summary||'',i.url,`${i.source} ${i.pub_time}`)).join('')+`</section>`).join('');
  news.innerHTML=cols?`<div class="board news-board">${cols}</div>`:'<div class="empty">暂无新闻数据</div>';
}
function renderTweets(data){
  const cols=(data?.users||[]).map(u=>`<section><div class="col-head">${esc(u.display_name||u.username)}<div class="sub">${esc(u.username||'')}</div></div>`+(u.tweets||[]).map(t=>`<article class="card"><div class="text">${esc(t.text)}</div>`+(t.photos||[]).slice(0,1).map(src=>`<img class="photo" src="${esc(src)}" loading="lazy">`).join('')+`<div class="tweet-meta muted">${esc((t.meta||[]).join(' · '))}${t.url?` <a class="link" href="${esc(t.url)}" target="_blank" rel="noopener">原文</a>`:''}</div></article>`).join('')+`</section>`).join('');
  tweets.innerHTML=cols?`<div class="board x-board">${cols}</div>`:'<div class="empty">暂无 X 动态</div>';
}
function renderStocks(data){
  const summary=Object.entries(data?.summary||{}).map(([k,v])=>`${esc(k)}：${esc(v)}`).join('　');
  const cards=(data?.alerts||[]).map(a=>`<article class="card"><div class="stock-top"><div><div class="ticker">${esc(a.ticker)}</div><div class="muted">${esc(a.name)}</div></div><div class="pct">${esc(a.pct)}</div></div><div class="muted">${esc(a.price)}</div><div class="analysis">${esc(a.analysis)}</div></article>`).join('');
  stocks.innerHTML=(summary?`<div class="summary">${summary}</div>`:'')+(cards?`<div class="board stock-board">${cards}</div>`:'<div class="empty">暂无股价异动</div>');
}
function renderXueqiu(data){
  const byUser=new Map();
  (data?.users||[]).forEach(u=>byUser.set(String(u.user_id),{user:u,posts:[]}));
  (data?.posts||[]).forEach(p=>{const id=String(p.user_id||p.screen_name); if(!byUser.has(id))byUser.set(id,{user:{screen_name:p.screen_name},posts:[]}); byUser.get(id).posts.push(p)});
  const cols=[...byUser.values()].map(({user,posts})=>`<section><div class="col-head">${esc(user.screen_name||'雪球用户')}<div class="sub">${posts.length} 条</div></div>`+posts.map(p=>renderCard(p.title||p.screen_name,p.text,p.url,p.created_at)).join('')+`</section>`).join('');
  xueqiu.innerHTML=cols?`<div class="xueqiu-board">${cols}</div>`:'<div class="empty">暂无雪球数据</div>';
}
function renderWechat(data){
  const allLabel='\u5168\u90e8';
  const unnamedLabel='\u672a\u547d\u540d';
  const articles=data?.articles||[];
  const counts=new Map();
  articles.forEach(a=>counts.set(a.mp_name||unnamedLabel, (counts.get(a.mp_name||unnamedLabel)||0)+1));
  const sources=[...counts.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'zh-CN'));
  const filterHtml=[[allLabel,articles.length],...sources].map(([name,count],i)=>`<button class="filter-btn${i===0?' active':''}" type="button" data-source="${esc(name)}">${esc(name)} &middot; ${count}</button>`).join('');
  const itemHtml=a=>`<article class="wechat-item" data-source="${esc(a.mp_name||unnamedLabel)}"><div class="wechat-main">${titleLink(a.title,a.url)}<div class="wechat-source"><span>${esc(a.mp_name||unnamedLabel)}</span>${(a.keywords||[]).slice(0,4).map(k=>`<span class="kw">${esc(k)}</span>`).join('')}</div>${a.summary?`<div class="text">${esc(a.summary)}</div>`:''}</div><div class="wechat-date">${esc(a.date||'')}</div></article>`;
  const items=articles.map(itemHtml).join('');
  const warn=data?.warning?`<div class="summary">${esc(data.warning)}</div>`:'';
  wechat.innerHTML=`<div class="wechat-board">${warn}<div class="wechat-panel"><div class="wechat-head"><div><h2>&#24494;&#20449;&#20844;&#20247;&#21495;</h2><div class="muted">&#25353;&#21457;&#24067;&#26102;&#38388;&#25490;&#24207;&#65292;&#28857;&#20987;&#26631;&#39064;&#25171;&#24320;&#21407;&#25991;</div></div><div class="wechat-stats"><span class="stat">${articles.length} &#31687;</span><span class="stat">${sources.length} &#20010;&#36134;&#21495;</span></div></div>${articles.length?`<div class="wechat-filters">${filterHtml}</div><div class="wechat-list">${items}</div>`:'<div class="empty">&#26242;&#26080;&#20844;&#20247;&#21495;&#25991;&#31456;</div>'}</div></div>`;
  wechat.querySelectorAll('.filter-btn').forEach(btn=>btn.addEventListener('click',()=>{
    wechat.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
    btn.classList.add('active');
    const source=btn.dataset.source;
    wechat.querySelectorAll('.wechat-item').forEach(item=>item.style.display=(source===allLabel||item.dataset.source===source)?'grid':'none');
  }));
}
</script>
</body>
</html>
